</style></head><body><div class="app"><aside><div class="logo"><svg viewBox="0 0 110 90" fill="#071a40" aria-label="Símbolo Alpha X"><path d="M5 79 56 10 70 29 33 79H5Z"/><path d="M45 79 72 43 97 79H75L63 61 50 79H45Z"/><path d="M77 10h23L84 31H62Z"/></svg><div><b>Alpha X</b><small>Plataforma para gestão de serviços.</small></div></div><button class="nav active" data-page="dashboard">◫ &nbsp; Visão geral</button><button class="nav" data-page="chamados">▤ &nbsp; Chamados</button><button class="nav" data-page="preventivas">▦ &nbsp; Preventivas</button><button class="nav" data-page="orcamentos">▧ &nbsp; Orçamentos</button><button class="nav" data-page="ordens">▤ &nbsp; Ordens de Serviço</button><button class="nav" data-page="unidades">▥ &nbsp; Unidades</button><button class="nav" data-page="prestadoras">♙ &nbsp; Prestadoras</button><button class="nav" data-page="ativos">▱ &nbsp; Ativos</button><button class="nav" data-page="relatorios">▥ &nbsp; Relatórios</button><button class="nav" data-page="configuracoes">⚙ &nbsp; Configurações</button><div class="asidefoot"><b>▣　Plano Profissional</b><br><small>　　 Válido até 31/12/2026</small></div></aside><main><header class="top"><div><h1 id="heading">Olá, Rafael Souza</h1><span class="muted">Gestor de Manutenção</span></div><div class="row"><span class="headericon">♧ <sup>3</sup></span><span class="headericon">ⓘ</span><span class="company"><b class="companyicon">▥</b> NINE EIGHT　⌄</span><select class="outline" id="role"><option value="Contratante">Contratante</option><option value="Prestadora">Prestadora</option></select></div></header><div id="content"></div></main></div><script>
const seed=[{id:1181,title:'Vazamento no banheiro',unit:'Loja Centro',type:'Hidráulica',desc:'Torneira com vazamento constante.',status:'Em andamento',budget:380,approved:true,messages:[{who:'Contratante',text:'Precisamos verificar a torneira.'}],photos:[]},{id:1180,title:'Troca de lâmpadas',unit:'Loja Cohama',type:'Elétrica',desc:'Substituir 6 lâmpadas queimadas.',status:'Aguardando orçamento',budget:null,approved:false,messages:[],photos:[]},{id:1179,title:'Reparo no forro',unit:'CD São Luís',type:'Civil',desc:'Forro danificado na área de estoque.',status:'Aberto',budget:null,approved:false,messages:[],photos:[]}];let data;try{data=JSON.parse(localStorage.getItem('alphax-v1'))||seed}catch{data=seed}let page='dashboard',selected=0;const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem('alphax-v1',JSON.stringify(data));function btn(label,action,outline=false){return '<button class="'+(outline?'outline':'primary')+'" onclick="'+action+'">'+label+'</button>'}function go(p){page=p;render()}function openTicket(id){selected=id;go('detalhe')}function list(){return '<div class="tablehead"><span>#</span><span>Chamado</span><span>Unidade</span><span>Tipo</span><span>Status</span></div>'+data.map(t=>'<button class="ticket" onclick="openTicket('+t.id+')"><b>#'+t.id+'</b><span><b>'+esc(t.title)+'</b><small>'+esc(t.desc)+'</small></span><span>'+esc(t.unit)+'</span><span>'+esc(t.type)+'</span><span class="tag">'+esc(t.status)+'</span></button>').join('')}function render(){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('heading').textContent=page==='dashboard'?'Olá, Rafael Souza':({chamados:'Chamados',novo:'Novo chamado',detalhe:'Detalhes do chamado',preventivas:'Preventivas',orcamentos:'Orçamentos',relatorios:'Relatórios',ordens:'Ordens de Serviço',unidades:'Unidades',prestadoras:'Prestadoras',ativos:'Ativos',configuracoes:'Configurações'})[page];let h='';if(page==='dashboard'){const count=s=>data.filter(t=>t.status===s).length;h='<div class="dash"><div><div class="row"><div><h2 style="font-size:27px;margin-bottom:4px">Visão geral</h2><span class="muted">Monitore chamados, custos e operações em um só lugar</span></div><span class="outline">Novembro de 2026</span></div><div class="cards">'+[['▤','Chamados abertos',count('Aberto')],['▷','Em andamento',count('Em andamento')],['✓','Concluídos',count('Concluído')],['⚠','Atrasados',count('Atrasado')]].map(x=>'<div class="card kpi"><span>'+x[0]+' '+x[1]+'</span><b>'+x[2]+'</b><span>Visão atual</span></div>').join('')+'</div><div class="charts"><div class="card"><h2>Chamados por status</h2><div class="donut"><div><b>'+data.length+'</b><small>Total</small></div></div><div class="muted" style="text-align:center">Abertos · Em andamento · Concluídos</div></div><div class="card"><h2>Chamados por tipo</h2>'+['Elétrica','Hidráulica','Civil','Climatização'].map(c=>{const n=data.filter(t=>t.type===c).length;return '<div class="chartline"><span>'+c+'</span><div class="bar"><i style="width:'+(data.length?100*n/data.length:0)+'%"></i></div><b>'+n+'</b></div>'}).join('')+'</div></div><div class="card"><div class="row"><h2>Chamados recentes</h2>'+btn('Ver todos',"go('chamados')",true)+'</div>'+list()+'</div></div><div class="right">'+btn('＋ Novo chamado',"go('novo')")+['▣ Registrar ocorrência','▦ Manutenções preventivas','▤ Consultar orçamentos','☏ Chat dos chamados'].map((x,i)=>'<button class="quick" onclick="go(\''+['novo','preventivas','orcamentos','chamados'][i]+'\')">'+x+'</button>').join('')+'<div class="card"><h2>Próximas preventivas</h2><div class="event"><strong>22 NOV</strong><span><b>Revisão do ar-condicionado</b><small>Loja Centro</small></span></div><div class="event"><strong>25 NOV</strong><span><b>Limpeza de calhas</b><small>Loja Cohama</small></span></div><div class="event"><strong>28 NOV</strong><span><b>Inspeção elétrica</b><small>CD São Luís</small></span></div></div></div></div>'}else if(page==='chamados'){h='<div class="row section"><h2>Todos os chamados</h2>'+btn('＋ Novo chamado',"go('novo')")+'</div><div class="card">'+list()+'</div>'}else if(page==='novo'){h='<div class="card" style="max-width:750px"><h2>Abrir chamado</h2><form id="newform" class="stack"><label class="field">Título<input required name="title" placeholder="Ex.: Vazamento na pia"></label><label class="field">Unidade<select name="unit"><option>Loja Centro</option><option>Loja Cohama</option><option>CD São Luís</option></select></label><label class="field">Categoria<select name="type"><option>Hidráulica</option><option>Elétrica</option><option>Civil</option><option>Climatização</option><option>Outros</option></select></label><label class="field">Descrição<textarea required name="desc" placeholder="Descreva o problema..."></textarea></label><label class="field">Fotos do problema<input name="photos" type="file" accept="image/*" multiple></label><div class="actions"><button class="primary" type="submit">Criar chamado</button>'+btn('Cancelar',"go('chamados')",true)+'</div></form></div>';setTimeout(()=>{$('newform').onsubmit=async e=>{e.preventDefault();const f=e.target,d=new FormData(f),photos=[];for(const file of [...f.photos.files].slice(0,3)){if(file.size>900000){alert('Escolha fotos menores que 900 KB para esta demonstração.');return}photos.push(await new Promise(resolve=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.readAsDataURL(file)}))}const id=Math.max(1100,...data.map(t=>t.id))+1;data.unshift({id,title:d.get('title'),unit:d.get('unit'),type:d.get('type'),desc:d.get('desc'),status:'Aberto',budget:null,approved:false,messages:[],photos});try{save()}catch{alert('Armazenamento cheio. Reduza as fotos.')}openTicket(id)}},0)}else if(page==='detalhe'){const t=data.find(t=>t.id===selected);if(!t)return go('chamados');h='<div class="row section"><span class="muted">Chamado #'+t.id+' · '+esc(t.unit)+'</span>'+btn('← Voltar',"go('chamados')",true)+'</div><div class="two"><div class="stack"><div class="card"><div class="row"><h2>'+esc(t.title)+'</h2><span class="tag">'+esc(t.status)+'</span></div><p>'+esc(t.desc)+'</p><span class="muted">'+esc(t.type)+'</span><div class="photos">'+t.photos.map(p=>'<img src="'+p+'">').join('')+'</div></div><div class="card"><h2>Orçamento e execução</h2><p>'+(t.budget===null?'Aguardando envio de orçamento.':'Valor: <b>R$ '+Number(t.budget).toFixed(2).replace('.',',')+'</b>')+'</p><div class="actions">'+(t.budget===null?btn('Enviar orçamento','budget('+t.id+')'):'')+(t.budget!==null&&!t.approved?btn('Aprovar orçamento','approve('+t.id+')'):'')+(t.approved&&t.status!=='Concluído'?btn('Concluir serviço','complete('+t.id+')'):'')+'</div></div></div><div class="card"><h2>Chat do chamado</h2><div class="msgbox" id="msgbox">'+t.messages.map(m=>'<div class="msg '+(m.who===$('role').value?'mine':'')+'"><small>'+esc(m.who)+'</small>'+esc(m.text)+'</div>').join('')+'</div><form id="chat" class="actions" style="margin-top:12px"><input class="chatinput" id="chattext" required placeholder="Digite uma mensagem..."><button class="primary" type="submit">Enviar mensagem</button></form></div></div>';setTimeout(()=>{$('chat').onsubmit=e=>{e.preventDefault();t.messages.push({who:$('role').value,text:$('chattext').value});save();render()}},0)}else if(page==='preventivas'){h='<div class="card"><h2>Calendário de manutenção preventiva</h2><div class="event"><strong>22 NOV</strong><span>Revisão do ar-condicionado — Loja Centro</span></div><div class="event"><strong>25 NOV</strong><span>Limpeza de calhas — Loja Cohama</span></div><div class="event"><strong>28 NOV</strong><span>Inspeção elétrica — CD São Luís</span></div><p class="notice">Agenda ilustrativa do MVP.</p></div>'}else if(page==='orcamentos'){h='<div class="card"><h2>Orçamentos</h2>'+data.map(t=>'<button class="ticket" onclick="openTicket('+t.id+')"><b>#'+t.id+'</b><span>'+esc(t.title)+'</span><span>'+(t.budget===null?'Pendente':'R$ '+t.budget.toFixed(2))+'</span><span>'+esc(t.unit)+'</span><span class="tag">'+(t.approved?'Aprovado':'Pendente')+'</span></button>').join('')+'</div>'}else if(['ordens','unidades','prestadoras','ativos','configuracoes'].includes(page)){h='<div class="card"><h2>'+({ordens:'Ordens de Serviço',unidades:'Unidades',prestadoras:'Prestadoras',ativos:'Ativos',configuracoes:'Configurações'})[page]+'</h2><p class="notice">Módulo em desenvolvimento.</p></div>'}else if(page==='relatorios'){h='<div class="card"><h2>Indicadores</h2><p>Total de chamados: <b>'+data.length+'</b></p><p>Concluídos: <b>'+data.filter(t=>t.status==='Concluído').length+'</b></p><p>Em andamento: <b>'+data.filter(t=>t.status==='Em andamento').length+'</b></p><p class="notice">Dados locais desta demonstração.</p></div>'}$('content').innerHTML=h}function budget(id){let v=prompt('Valor do orçamento (R$):');if(v===null)return;let n=Number(v.replace(',','.'));if(!Number.isFinite(n)||n<=0)return alert('Valor inválido');let t=data.find(t=>t.id===id);t.budget=n;t.status='Aguardando orçamento';save();render()}function approve(id){let t=data.find(t=>t.id===id);t.approved=true;t.status='Em andamento';save();render()}function complete(id){data.find(t=>t.id===id).status='Concluído';save();render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));$('role').onchange=render;render();
</script></body></html>
